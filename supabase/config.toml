# Halomanage — Supabase CLI project config.
# Generated by hand (the CLI wasn't available in this environment) to match
# the layout `supabase init` would produce. Once you have the CLI installed
# (`npm i -g supabase` or `npx supabase`), `supabase link --project-ref
# <ref>` and this file will drive `supabase db push` / `supabase start`.

project_id = "halomanage"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true # organization owners may create a workspace; employees remain invitation-only

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true

[functions.invite-employee]
verify_jwt = true

[functions.payroll-import]
verify_jwt = true

[functions.send-notifications]
verify_jwt = false # invoked by Cron with the service_role key, not a user JWT

[functions.signature-webhook]
verify_jwt = false # invoked by the external e-signature provider, authenticated via its own webhook signature
